# llama-swap in front of llama.cpp for the labs: ONE endpoint, http://127.0.0.1:8080 (OpenAI-compatible), the request field `model` picks the model.
# The "unified" llama-swap images bundle llama-swap and llama.cpp (llama-server) per GPU family; `make llama-up` picks the profile with
# `detect_gpu.sh`, or start one by hand:
#   docker compose --profile cuda13 up -d   NVIDIA Ampere..Blackwell (A100, RTX 30/40/50xx, H100, DGX Spark)
#   docker compose --profile cuda up -d     NVIDIA Pascal..Ada (GTX 10xx, RTX 20xx; CUDA 12)
#   docker compose --profile vulkan up -d   AMD, Intel and other Vulkan GPUs
#   docker compose --profile cpu up -d      no GPU (macOS, Windows, VMs): the Vulkan image with zero offloaded layers
#   add --profile webui for Open WebUI on http://127.0.0.1:3000 (chat with the `chat` model)
# Models (llama-swap.yaml): chat, embgemma, minilm. GGUF files are read from ./models (see download_model.py). Ports are bound to localhost only.
name: aas-llama

x-swap: &swap
  restart: unless-stopped
  ports: ["127.0.0.1:${LLAMA_PORT:-8080}:8080"]
  volumes:
    - ./models:/models:ro
    - ./llama-swap.yaml:/etc/llama-swap/config/config.yaml:ro
  environment: &swap-env
    LLAMA_SWAP_LISTEN: 0.0.0.0:8080 # must stay on 0.0.0.0: a container that binds its own loopback is not reachable through the published port
    NGL: "99" # GPU layers; read by llama-swap.yaml as ${env.NGL}
  networks:
    default:
      aliases: [llama-swap] # Open WebUI reaches the active variant under one name
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 60
    start_period: 5s

x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

# Image tag = the floating unified-<backend> tag (latest build). To pin a build set SWAP_TAG=<date>, e.g. 2026-10-07 (tag unified-<backend>-2026-10-07).
services:
  llama-swap-cuda13:
    <<: [*swap, *nvidia]
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda13${SWAP_TAG:+-}${SWAP_TAG:-}
    profiles: [cuda13]

  llama-swap-cuda:
    <<: [*swap, *nvidia]
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda${SWAP_TAG:+-}${SWAP_TAG:-}
    profiles: [cuda]

  llama-swap-vulkan:
    <<: *swap
    image: ghcr.io/mostlygeek/llama-swap:unified-vulkan${SWAP_TAG:+-}${SWAP_TAG:-}
    profiles: [vulkan]
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-0}"

  # No unified CPU image exists: the Vulkan image runs llama.cpp on the CPU when no layer is offloaded and no device is passed.
  llama-swap-cpu:
    <<: *swap
    image: ghcr.io/mostlygeek/llama-swap:unified-vulkan${SWAP_TAG:+-}${SWAP_TAG:-}
    profiles: [cpu]
    environment:
      <<: *swap-env
      NGL: "0"

  # Chat UI for the `chat` model (class 12: edit the assistant's turns by hand, the notebook does it in code). Single user, no login, localhost only.
  webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_TAG:-v0.11.4-slim}
    profiles: [webui]
    restart: unless-stopped
    ports: ["127.0.0.1:${WEBUI_PORT:-3000}:8080"]
    volumes:
      - webui:/app/backend/data
    environment:
      ENABLE_PERSISTENT_CONFIG: "False" # the environment below always wins: otherwise the connection saved by the first start (volume) overrides it
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: http://llama-swap:8080/v1
      OPENAI_API_KEY: none # llama-swap has no key; Open WebUI wants a non-empty value
      WEBUI_AUTH: "False" # cannot be changed once the first account exists: `docker compose down -v` resets it
      WEBUI_NAME: AAS chat
      ENABLE_TITLE_GENERATION: "False" # no hidden background requests to the model: the chat history stays exactly what the user sees
      ENABLE_TAGS_GENERATION: "False"
      ENABLE_FOLLOW_UP_GENERATION: "False"
      ENABLE_AUTOCOMPLETE_GENERATION: "False"
      ENABLE_VERSION_UPDATE_CHECK: "False"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"

volumes:
  webui:
